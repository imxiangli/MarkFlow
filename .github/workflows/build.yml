name: Build & release

# Pushing a tag v<version> (matching package.json) builds the installers for macOS, Windows
# and Linux and publishes them as a GitHub release together with the signed update feed
# (latest.json, latest.json.sig and the changed app files), which installed apps read.
# Running the workflow by hand only builds the installers.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:md
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Set CSC_LINK / CSC_KEY_PASSWORD (and APPLE_ID… for notarisation) as secrets to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: markflow-${{ runner.os }}
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.tar.gz
          if-no-files-found: error

  # Requires the MARKFLOW_UPDATE_KEY secret: the contents of keys/update-private.pem, the
  # private half of src/main/update-public-key.ts.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag and signing key
        env:
          HAS_KEY: ${{ secrets.MARKFLOW_UPDATE_KEY != '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Add the MARKFLOW_UPDATE_KEY secret (contents of keys/update-private.pem)"; exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::Release $TAG is already published"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Build the update feed
        env:
          MARKFLOW_UPDATE_KEY: ${{ secrets.MARKFLOW_UPDATE_KEY }}
        run: |
          # Release notes: the annotated tag's message, if any.
          git fetch --force --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          args=(--github "$GITHUB_REPOSITORY" --tag "$TAG" --full-dir installers --out gh-assets)
          [ -s notes.md ] && args+=(--notes-file notes.md)
          # The previous release's manifest: app files it already has are not uploaded again.
          if curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" -o previous.json; then
            args+=(--previous previous.json)
          fi
          node scripts/release-update.mjs "${args[@]}"
      - name: Publish the release
        run: |
          # A draft left behind by a failed run is replaced; the tag stays.
          gh release delete "$TAG" --yes 2>/dev/null || true
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" --draft --verify-tag --title "MarkFlow $VERSION" "${notes[@]}"
          gh release upload "$TAG" installers/* gh-assets/*
          # Publishing last switches releases/latest — and so every installed app — in one step.
          gh release edit "$TAG" --draft=false --latest
