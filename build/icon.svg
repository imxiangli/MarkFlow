<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A single broad-nib pen stroke writing "M" and flowing out into a tail.
       The nib is a fixed 150px segment at 35°, so each straight stroke is a
       parallelogram and the tail is its curve shifted by ±nib/2. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2c58"/>
      <stop offset="1" stop-color="#0b1330"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#4466e0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4466e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="216" y1="250" x2="806" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf4d"/>
      <stop offset="0.48" stop-color="#ff6b5a"/>
      <stop offset="1" stop-color="#e2409f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050916" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  </g>
  <path fill="url(#ink)" d="M221 767L221 361L343 275L343 681ZM343 275L539 547L417 633L221 361ZM417 633L613 361L735 275L539 547ZM735 275L735 577L613 663L613 361ZM735 577C735 727 817 727 907 664L785 750C695 813 613 813 613 663Z"/>
</svg>
