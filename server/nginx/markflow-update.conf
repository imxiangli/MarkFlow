# MarkFlow update feed for an existing nginx.
#
# Either drop this file into /etc/nginx/conf.d/ as a standalone server, or copy the two
# `location` blocks into the `server { ... }` of a site that already has TLS configured.
# Files live in /srv/markflow (latest.json, versions/, files/, full/) and are served at
#   https://<your-domain>/markflow/

server {
    listen 80;
    listen [::]:80;
    server_name _;            # replace with your domain; add `listen 443 ssl` + certificates for HTTPS

    location = /healthz {
        return 200 "ok";
    }

    location ^~ /markflow/ {
        root /srv;                              # /markflow/x → /srv/markflow/x
        default_type application/octet-stream;
        types {
            application/json json;
            text/plain       sig;
            application/gzip gz;
        }
        # Never let nginx re-encode the pre-compressed blobs or installers.
        gzip off;
        gzip_static off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;

        # The manifest must always be revalidated.
        location ~ ^/markflow/latest\.json(\.sig)?$ {
            root /srv;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
